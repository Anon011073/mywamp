[mysqld]
# Basic Settings
basedir="C:\myesmp\mysql"
datadir="C:\myesmp\mysql\data"
port=3306
character-set-server=utf8mb4
default_authentication_plugin=mysql_native_password

# Minimal InnoDB Settings (MySQL 8 defaults work best when simplified)
# We let MySQL handle the paths automatically based on the datadir

# Performance
key_buffer_size=16M
max_allowed_packet=16M

# Logging
log-error="C:\myesmp\mysql\data\mysql_error.log"
