[mysqld]
# Basic Settings
basedir="C:\myesmp\mysql"
datadir="C:\myesmp\mysql\data"
port=3306
character-set-server=utf8mb4

# Windows Filesystem Stability Settings
innodb_flush_method=normal
innodb_redo_log_capacity=10M

# Performance
key_buffer_size=16M
max_allowed_packet=16M

# Logging
log-error="C:\myesmp\mysql\data\mysql_error.log"

# Compatibility with some older clients
authentication_policy=mysql_native_password
