[mysqld]
# Basic Settings
basedir="C:/myesmp/mysql"
datadir="C:/myesmp/mysql/data"
port=3306
character-set-server=utf8mb4
default_authentication_plugin=mysql_native_password

# Required for some MySQL setups
tmpdir="C:/myesmp/mysql/data"
innodb_data_home_dir="C:/myesmp/mysql/data"
innodb_log_group_home_dir="C:/myesmp/mysql/data"

# Memory and Performance
key_buffer_size=16M
max_allowed_packet=16M
myisam_sort_buffer_size=8M

# Logging
log-error="C:/myesmp/mysql/data/mysql_error.log"
