ServerRoot "C:/myesmp/apache"
Listen 80

# Load Essential Modules
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module "C:/myesmp/php/php8apache2_4.dll"

# Standard Server Settings
ServerAdmin admin@localhost
ServerName localhost:80

# Logging
ErrorLog "C:/myesmp/apache/logs/error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "C:/myesmp/apache/logs/access.log" common

# PHP Support
AddHandler application/x-httpd-php .php
PHPIniDir "C:/myesmp/php"

# Document Root Configuration
DocumentRoot "C:/myesmp/www"
<Directory "C:/myesmp/www">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# phpMyAdmin Alias
Alias /phpmyadmin "C:/myesmp/phpmyadmin"
<Directory "C:/myesmp/phpmyadmin">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>
